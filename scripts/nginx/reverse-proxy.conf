server {
    listen 80;
    server_name _;

    # Si este Nginx está detrás de otro proxy/balanceador, confía en esos rangos
    # para recuperar la IP real del cliente desde X-Forwarded-For.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Si tienes HTTPS en este proxy, cambia $scheme por "https"
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        # Cadena de proxy e IP real del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Identidad de usuario (si usas autenticación en Nginx)
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Authenticated-User $remote_user;
        proxy_set_header X-Windows-User $remote_user;

        # Hostname cliente solo si lo envías desde otro sistema/agente
        proxy_set_header X-Client-Hostname $http_x_client_hostname;
    }
}
