server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Trust upstream reverse proxies (IIS/ARR, gateway, LAN proxies)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Preserve client identity through proxy chain
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Pass-through workstation identity when provided by upstream proxy/IIS
        proxy_set_header X-Windows-User $http_x_windows_user;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Authenticated-User $http_x_authenticated_user;
        proxy_set_header X-Client-Hostname $http_x_client_hostname;
        proxy_set_header X-Forwarded-Hostname $http_x_forwarded_hostname;
        proxy_set_header X-Computer-Name $http_x_computer_name;
        proxy_set_header X-Machine-Name $http_x_machine_name;
        proxy_set_header X-Client-Private-IP $http_x_client_private_ip;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Preserve client identity through proxy chain
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Pass-through workstation identity when provided by upstream proxy/IIS
        proxy_set_header X-Windows-User $http_x_windows_user;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Authenticated-User $http_x_authenticated_user;
        proxy_set_header X-Client-Hostname $http_x_client_hostname;
        proxy_set_header X-Forwarded-Hostname $http_x_forwarded_hostname;
        proxy_set_header X-Computer-Name $http_x_computer_name;
        proxy_set_header X-Machine-Name $http_x_machine_name;
        proxy_set_header X-Client-Private-IP $http_x_client_private_ip;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
